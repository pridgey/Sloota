name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version name
        id: version
        run: |
          NAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Releases must always be signed with the same key, or installed copies can't update.
      - name: Require the signing key for releases
        if: github.event_name == 'push' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::KEYSTORE_BASE64 is missing. Run scripts/setup-signing.sh once."
          exit 1

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SLOOTA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and build
        env:
          SLOOTA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SLOOTA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SLOOTA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sloota-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

  release:
    name: Publish GitHub release
    # Every push to main becomes a release, which installed copies pick up as an update.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sloota-*
          merge-multiple: true
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Sloota ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: apks/*-release.apk
          generate_release_notes: true
          make_latest: true
